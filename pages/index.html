<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../scripts/script.js" defer></script>
    <title>Pokédex</title>
</head>

<body>
    <header>
        <section class="ImgTitulo">
            <img id="Pokebola" src="../assets/Pokebola-titulo.png" alt="Pokebola">
            <h1 id="titulo"><strong>Pokédex</strong></h1>
            <p id="fraseTitulo"><strong>Veja aqui uma pokédex com os mais váriados pokémons!</strong></p>
        </section>
        <hr>
    </header>
    <main class="container">
        <div class="row mb-4 mt-3">
            <div class="col-md-6 mb-3 mb-md-0">
                <input type="text" id="searchInput" class="form-control" placeholder="Pesquisar Pokémon pelo nome...">
            </div>
            <div class="col-md-6">
                <select id="sortSelect" class="form-select">
                    <option value="">Ordenar por...</option>
                    <option value="az">Nome: A - Z</option>
                    <option value="hp_desc">HP: Maior para Menor</option>
                    <option value="hp_asc">HP: Menor para Maior</option>
                    <option value="attack_desc">Ataque: Maior para Menor</option>
                    <option value="attack_asc">Ataque: Menor para Maior</option>
                    <option value="defense_desc">Defesa: Maior para Menor</option>
                    <option value="defense_asc">Defesa: Menor para Maior</option>
                    <option value="special-attack_desc">Ataque Especial: Maior para Menor</option>
                    <option value="special-attack_asc">Ataque Especial: Menor para Maior</option>
                    <option value="special-defense_desc">Defesa Especial: Maior para Menor</option>
                    <option value="special-defense_asc">Defesa Especial: Menor para Maior</option>
                    <option value="speed_desc">Velocidade: Maior para Menor</option>
                    <option value="speed_asc">Velocidade: Menor para Maior</option>
                </select>
            </div>
        </div>

        <div class="row" id="pokedex-grid">
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4 mb-5">
            <button id="btnAnterior" class="btn btn-danger" onclick="mudarPagina(-1)">&#8592; Anterior</button>
            <div class="dropdown align-self-center">
                <button class="btn btn-dark dropdown-toggle fw-bold" type="button" id="btnPaginas"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    Página 1
                </button>
                <ul class="dropdown-menu text-center" id="listaPaginas" aria-labelledby="btnPaginas">
                </ul>
            </div>
            <button id="btnProximo" class="btn btn-danger" onclick="mudarPagina(1)">Próxima &#8594;</button>
        </div>
    </main>

    <div class="modal fade" id="pokemonModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-capitalize" id="modalName">Nome do Pokemon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" alt="" class="img-fluid mb-3" style="max-width: 150px;">
                    <div id="modalTypes" class="mb-3"></div>
                    <ul class="list-group text-start" id="modalStats">
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
