<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../scripts/script.js" defer></script>
    <title>Pokédex</title>
</head>

<body>
    <header>
        <section class="ImgTitulo">
            <img id="Pokebola" src="../assets/Pokebola-titulo.png" alt="Pokebola">
            <h1 id="titulo"><strong>Pokédex</strong></h1>
            <p id="fraseTitulo"><strong>Veja aqui uma pokédex com os mais váriados pokémons!</strong></p>
        </section>
        <hr>
    </header>
    <main class="container">
        <div class="row" id="pokedex-grid">

        </div>
    </main>

    <div class="modal fade" id="pokemonModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-capitalize" id="modalName">Nome do Pokemon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" alt="" class="img-fluid mb-3" style="max-width: 150px;">
                    <div id="modalTypes" class="mb-3"></div>
                    <ul class="list-group text-start" id="modalStats">

                    </ul>
                </div>
            </div>
        </div>
    </div>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
